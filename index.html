<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Levli — Personal Logbook &amp; Tracker</title>
    <meta name="description" content="Levli is a personal logbook and tracker for medication doses, symptoms, weight and nutrition. It is not medical advice." />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16.png?v=2" />
    <link rel="icon" href="/assets/brand/favicon.ico?v=2" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon-180.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Launch theme, resolved before the first paint so the window background,
         the handover from the native launch screen and the animated splash all
         show one colour — no white flash, no mid-launch flip. The saved in-app
         theme wins; with none saved, the device setting governs, which is the
         same rule the app itself follows. Keep both values here in step with
         --launch-bg in src/index.css. -->
    <style>
      html { background-color: #ffffff; }
      html.dark { background-color: #030712; }
    </style>
    <script>
      (function () {
        var dark = null;
        try {
          var saved = window.localStorage.getItem("levli:profile");
          if (saved) {
            var profile = JSON.parse(saved);
            if (profile && profile.theme_chosen === true && typeof profile.dark_mode === "boolean") {
              dark = profile.dark_mode;
            }
          }
        } catch (e) { /* no readable saved theme */ }
        if (dark === null) {
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e2) {
            dark = false;
          }
        }
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#030712" : "#ffffff");
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Levli" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json?v=2" />
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
